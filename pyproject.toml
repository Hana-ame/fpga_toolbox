[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-toolbox"
version = "0.7.6"
description = "Modular FPGA verification toolbox with anti-silent-pass guardrails for AI agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
fpga-toolbox = "fpga_toolbox.cli:main"

[tool.setuptools.packages.find]
# 用 find 而不是显式列表：`packages = ["fpga_toolbox", "fpga_toolbox.core"]`
# 在新增子包（如拆分 protocol_tb_emitter 后引入的 fpga_toolbox.emitters）时会被
# 静默漏掉 —— wheel 里没有该目录，安装后 `No module named 'fpga_toolbox.emitters'`，
# 而 audit_harness（MCP tools/call 路径）当场失败。CI 的 build job 实测抓到。
# include 明确限定前缀，避免误收 tests/ 或 examples/。
include = ["fpga_toolbox*"]

[tool.ruff]
target-version = "py310"
line-length = 130
extend-exclude = ["examples"]

[tool.ruff.lint]
# Deliberately narrow: syntax errors, pyflakes, import order. Style churn is not a CI concern.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
