[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-toolbox"
version = "0.2.0"
description = "Modular FPGA verification toolbox exposed as atomic tools for AI agent harnesses"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
fpga-toolbox = "fpga_toolbox.cli:main"

[tool.setuptools]
packages = ["fpga_toolbox", "fpga_toolbox.core", "fpga_toolbox.tools"]

[tool.ruff]
target-version = "py39"
line-length = 130

[tool.ruff.lint]
# Deliberately narrow: syntax errors, pyflakes, import order. Style churn is not a CI concern.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
