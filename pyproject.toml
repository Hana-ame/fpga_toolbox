[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-toolbox"
version = "0.2.0"
description = "Modular FPGA verification toolbox exposed as atomic tools for AI agent harnesses"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
fpga-toolbox = "fpga_toolbox.cli:main"

[tool.setuptools]
packages = ["fpga_toolbox", "fpga_toolbox.core", "fpga_toolbox.tools"]
