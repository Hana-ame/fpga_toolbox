name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check --output-format=github fpga_toolbox tests

      - name: Syntax gate for Python 3.10
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          # 全仓库扫描，不只是包和测试：docs/ 与 examples/ 里的脚本同样会被
          # 用户在低版本 Python 上执行。真实缺陷：docs/build_docs_html.py 曾把
          # 反斜杠放进 f-string 表达式（Python 3.12+ 才允许），本地 3.13 测不出，
          # py3.10/3.11 的 CI 直接 SyntaxError。旧的扫描范围漏掉了 docs/。
          bad = []
          for root in ("fpga_toolbox", "tests", "docs", "examples"):
              for path in pathlib.Path(root).rglob("*.py"):
                  try:
                      ast.parse(path.read_text(encoding="utf-8"), feature_version=(3, 10))
                  except SyntaxError as exc:
                      bad.append(f"{path}:{exc.lineno}: {exc.msg}")
          if bad:
              print("\n".join(bad))
              sys.exit("files above do not parse under Python 3.10")
          print("all modules parse under Python 3.10")
          PY

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}${{ matrix.slang == false && ', no slang' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # slang 维度是**显式**的：装了 slang 的节点会断言 slang 真的可用，
          # 降级节点会断言它确实不在。否则 `continue-on-error` 的安装步骤一旦
          # 下载失败，节点会静默退化成降级节点 —— 名义上测了 slang 路径，实际
          # 只测了 builtin 回退，把内置解析器的回归掩盖掉。
          - os: ubuntu-24.04
            python: "3.10"
            slang: true
          - os: ubuntu-latest
            python: "3.11"
            slang: true
          - os: ubuntu-latest
            python: "3.13"
            slang: true
          - os: windows-latest
            python: "3.13"
            slang: true
          # 唯一的降级节点：不装 slang，专测内置解析器 + 六层门禁的「无 slang」
          # 口径（ruff 仍装在 lint job、verilator 由 ubuntu runner 自带或无）。
          # 更极端的「连 verilator/ruff 都没有」由独立的 test-no-eda job 覆盖。
          - os: ubuntu-latest
            python: "3.11"
            slang: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6.0"

      # slang 用于 W102 未知例化检测（token 启发式无法区分 `vendor_ip u(` 与
      # `function int foo(`，会海量误报）。装上是让该特性在 CI 真正被验证；
      # 装不上不失败——工具按设计降级为不报未知，测试会显式跳过相关断言。
      - name: Install slang (enables W102 CST backend)
        if: matrix.slang
        continue-on-error: true
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          if [ "${{ runner.os }}" = "Windows" ]; then
            url="https://github.com/MikePopoloski/slang/releases/download/v12.2/slang-windows-x86_64.zip"
            curl -sSL -o slang.zip "$url"
            unzip -q -o slang.zip -d slang-dist
            find slang-dist -name "slang.exe" -exec cp {} "$RUNNER_TEMP/bin/" \; 2>/dev/null || true
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          else
            url="https://github.com/MikePopoloski/slang/releases/download/v12.2/slang-linux-x86_64.tar.gz"
            curl -sSL "$url" | tar -xz -C "$RUNNER_TEMP"
            slang_bin="$(find "$RUNNER_TEMP" -name slang -type f -perm -u+x | head -1)"
            cp "$slang_bin" "$RUNNER_TEMP/bin/"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      # 双向断言：让「有 slang」与「无 slang」两个分支都成为**可验证的事实**，
      # 而不是靠安装步骤是否碰巧成功。矩阵节点名里写了什么就必须是什么。
      - name: Assert slang availability matches the matrix
        shell: bash
        run: |
          if command -v slang >/dev/null 2>&1; then
            have=true
            slang --version 2>&1 | head -2 || true
          else
            have=false
          fi
          want="${{ matrix.slang }}"
          echo "matrix.slang=$want, detected=$have"
          if [ "$want" = "true" ] && [ "$have" != "true" ]; then
            echo "::error::this matrix node claims slang but slang is not installed;"
            echo "::error::the builtin fallback would silently mask parser regressions"
            exit 1
          fi
          if [ "$want" = "false" ] && [ "$have" = "true" ]; then
            echo "::error::this is the no-slang degraded node but slang is present"
            exit 1
          fi

      - name: Core regression suite
        run: python tests/test_regression.py

      - name: Fusion & cross-repo AXI/APB benchmark suite
        run: python tests/test_fusion_and_cross_repo.py

      - name: EDA campaign parsers (UVM / DC-PT QoR / PT netlist cleaner)
        run: python tests/test_eda_campaign.py

      - name: Domain regression suites (SV parser / protocol TB / iface binding)
        run: |
          python tests/test_sv_parser_coverage.py
          python tests/test_protocol_emitter_coverage.py
          python tests/test_iface_binding_coverage.py

      - name: Domain regression suites (sim & normalizer / security / repo & sandbox / tooling)
        run: |
          python tests/test_sim_and_normalizer_coverage.py
          python tests/test_security_coverage.py
          python tests/test_repo_and_sandbox_coverage.py
          python tests/test_tooling_coverage.py
          python tests/test_mcp_server.py

      - name: Six-layer invariant gate
        run: python scripts/verify_invariants.py --fast

      # Layer 4（100% 函数覆盖率）此前从未在 CI 跑过，所以「无 slang 时解析器
      # 退化」「测试强依赖 verilator」这类问题长期漏网（评审 181/182/183）。
      # 有 slang 的矩阵节点跑完整门禁，覆盖数应为 171/171。
      - name: Six-layer invariant gate (full, includes Layer 4 coverage)
        run: python scripts/verify_invariants.py --full

      - name: Self-audit gate (anti-silent-pass)
        run: python -m fpga_toolbox audit_harness

      - name: Docs consistency gate (D1-D13 incl. diag code coverage)
        run: python examples/axi_apb_ref/axi/docs_check.py

      # HTML 文档由 docs/*.md 派生。markdown 是唯一事实源，这里确保 HTML 没有
      # 被人单独改过（或改了 md 忘了重新生成）。
      - name: Docs HTML in sync with markdown
        run: python docs/build_docs_html.py --check

      - name: CLI & MCP schema contract
        run: |
          python -m fpga_toolbox list
          python -m fpga_toolbox schemas

      - name: Install package
        run: python -m pip install .

      - name: Console entry point
        run: fpga-toolbox list

  # 零 EDA 降级口径（最极端的一档）：README 声明「零 EDA 强依赖，仅 PyYAML」，
  # 因此必须有一个**只装 PyYAML** 的节点，验证全部测试与六层门禁在该环境下
  # 同样通过。与矩阵里的 `slang: false` 节点分工：
  #   * 矩阵节点  → 无 slang，但 verilator / ruff 可能可用（正常开发机形态）
  #   * 本 job    → slang / verilator / ruff 全都没有（README 承诺的最低口径）
  # 这两档共同构成评审 181/182/183 的根因防护：此前所有节点都装 slang，
  # 把「无 slang 时 builtin 后端把 typedef 端口误判成 1-bit」和「测试强依赖
  # verilator」全掩盖了。
  test-no-eda:
    name: test (ubuntu-latest, py3.11, zero EDA tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime deps only (no slang / verilator / ruff)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6.0"

      - name: Prove the environment is genuinely EDA-free
        run: |
          for tool in slang verilator ruff; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool unexpectedly present; this job must be zero-EDA"
              exit 1
            fi
          done
          echo "confirmed: slang/verilator/ruff absent"

      - name: Core suites in degraded mode
        run: |
          python tests/test_regression.py
          python tests/test_fusion_and_cross_repo.py
          python tests/test_eda_campaign.py

      - name: Domain suites in degraded mode
        run: |
          python tests/test_sv_parser_coverage.py
          python tests/test_protocol_emitter_coverage.py
          python tests/test_iface_binding_coverage.py
          python tests/test_sim_and_normalizer_coverage.py
          python tests/test_security_coverage.py
          python tests/test_repo_and_sandbox_coverage.py
          python tests/test_tooling_coverage.py
          python tests/test_mcp_server.py

      # 零 EDA 下 Layer 3 应自动降级为 compileall，Layer 4 应把「必须 fork
      # slang 才能执行」的函数显式排除（并在输出里说明），而不是判失败。
      - name: Six-layer invariant gate (full, zero-EDA)
        run: python scripts/verify_invariants.py --full

      - name: Self-audit gate
        run: python -m fpga_toolbox audit_harness

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel imports and runs
        run: |
          python -m pip install dist/*.whl
          python -c "import fpga_toolbox; print('version', fpga_toolbox.__version__)"
          fpga-toolbox list
          fpga-toolbox audit_harness

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
